<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:14px 0 6px}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
button,input,textarea,select{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pr,.tabs button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.dn{color:var(--dn)}
button.sm{padding:4px 10px}

input[type=checkbox]{width:auto;margin:0 0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px}.row>*{flex:1}

a.btn{display:block;text-align:center;text-decoration:none;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;margin:8px 0}
.nav{margin:8px 0}.ct{text-align:center}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wh{text-align:center;font-size:12px;color:var(--mut)}

.dc.oth{opacity:.4}.dc.tod{border-color:var(--pr);border-width:2px}.dc.sel{background:var(--pr);color:var(--prt)}
.dc i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;background:var(--dn);color:#fff;border-radius:8px;padding:0 5px;line-height:15px}
.wk{display:flex;flex-direction:column;gap:6px}.wd{display:flex;gap:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px}.wd.tod{border-color:var(--pr);border-width:2px}
.wl{width:64px;flex:none;display:flex;flex-direction:column}.wc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const SCOPE='openid email profile https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events';
const DB_NAME='قاعدة بيانات المرضى',FOLDER_NAME='صور المرضى',T1='المرضى',T2='المواعيد',T3='الأجهزة';
const REDIRECT_URI='__REDIRECT_URI__',NATIVE_SCHEME='burnzarqa';
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const NP=n=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n])||null;
const H1=['اسم المريض','البريد الإلكتروني','العمر','رقم الاتصال','الرقم الوطني','التشخيص','اسم العملية','الطبيب المعالج','نوع العملية','تاريخ العملية','حالة العملية','ملاحظات','المرجع','روابط صور الفحوصات والأشعة والاستشارات','روابط صور الحالة المرضية','روابط صور قبل العملية','روابط صور بعد العملية','المعرّف','معرّف حدث التقويم','تاريخ الإنشاء','أدخله','آخر تعديل بواسطة','آخر تعديل في'];
const H3=['رمز الجهاز','المستخدم','البريد','آخر تحديث'];
const H2=['اسم المريض','التاريخ','ملاحظة','معرّف المريض','المعرّف','أضافه'];
const OT={major:'رئيسية',daily:'يومية'},OS={post:'مؤجلة',cancelled:'ملغاة',done:'تمت'};
const rev=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
const OTr=rev(OT),OSr=rev(OS);
const P=[['inv','صور الفحوصات والأشعة والاستشارات'],['cond','صور الحالة المرضية'],['before','صور قبل العملية'],['after','صور بعد العملية']];
const DEMO_ONLY=false;
const DEF={clientId:'',deptEmail:'',sheetUrl:'',calId:'',autoCal:true,doctors:'د غيث مساعدة، د أكرم عبوي، د معتز قسايمة، د اياد صوالحة'};

const MEM={};
const LS={get(k){try{const v=localStorage.getItem(k);return v==null?(MEM[k]==null?null:MEM[k]):v}catch(e){return MEM[k]==null?null:MEM[k]}},set(k,v){MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
let cfg=Object.assign({},DEF);
function loadCfg(u){let c={};try{c=JSON.parse(LS.get('cfg_'+u)||LS.get('cfg_default')||'{}')}catch(e){}cfg=Object.assign({},DEF,c);}
function saveCfg(){const j=JSON.stringify(cfg);LS.set('cfg_'+S.me.username,j);LS.set('cfg_default',j);}
const SS={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
/* local app accounts (identification only; Google sign-in is the real gate to the data) */
const getUsers=()=>{try{return JSON.parse(LS.get('users')||'{}')}catch(e){return {}}};
const b64e=a=>btoa(String.fromCharCode(...a)),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:150000,hash:'SHA-256'},k,256)));
}
const who=()=>S.me?(S.me.name||S.me.username):'';
const stamp=()=>{const d=new Date();return ymd(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const docs=()=>cfg.doctors.split(/[،,\n]/).map(s=>s.trim()).filter(Boolean);

const S={screen:'auth',demo:false,me:null,authMode:'',mine:false,user:null,sid:'',gid:{},folder:'',pts:[],ap:[],cur:null,tab:'p',q:'',adding:false,lb:null};
let token=null,tokenExp=0,tc=null,tcCid='',pend=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=(t,ok)=>{const m=$('#msg');m.textContent=t||'';m.className=ok?'ok':'';};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('ar-JO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}catch(e){return d}};
const col=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
const q1=t=>"'"+t+"'";

/* ---------- Google auth + http ---------- */
let nPend=null;
function nativeToken(interactive){
  return new Promise((res,rej)=>{
    if(token&&Date.now()<tokenExp-60000&&!interactive)return res(token);
    if(!cfg.clientId)return rej(new Error('أدخل Client ID من الإعدادات'));
    const B=NP('Browser');if(!B)return rej(new Error('المتصفح الداخلي غير متاح'));
    const hint=cfg.deptEmail||(S.user&&S.user.email)||LS.get('email')||'';
    const st=uid();
    const p=new URLSearchParams({client_id:cfg.clientId,redirect_uri:REDIRECT_URI,response_type:'token',scope:SCOPE,state:st,include_granted_scopes:'true'});
    if(hint)p.set('login_hint',hint);
    if(!interactive)p.set('prompt','none');else if(!hint)p.set('prompt','select_account');
    nPend={res,rej,st,interactive};
    B.open({url:'https://accounts.google.com/o/oauth2/v2/auth?'+p.toString()}).catch(e=>{nPend=null;rej(e);});
  });
}
function initNative(){
  const A=NP('App'),B=NP('Browser');
  if(!A)return;
  A.addListener('appUrlOpen',e=>{
    if(!e.url||e.url.indexOf(NATIVE_SCHEME+'://oauth')!==0)return;
    const h=new URLSearchParams(e.url.split('#')[1]||e.url.split('?')[1]||'');
    const pe=nPend;nPend=null;if(B)B.close().catch(()=>{});
    if(!pe)return;
    if(h.get('error')){pe.rej(new Error(pe.interactive?(h.get('error_description')||h.get('error')):'AUTH'));return;}
    if(h.get('state')!==pe.st){pe.rej(new Error('AUTH'));return;}
    token=h.get('access_token');tokenExp=Date.now()+(Number(h.get('expires_in'))||3600)*1000;pe.res(token);
  });
  if(B)B.addListener('browserFinished',()=>{setTimeout(()=>{if(nPend){const pe=nPend;nPend=null;pe.rej(new Error(pe.interactive?'لم يكتمل تسجيل الدخول':'AUTH'));}},800);});
}
function getToken(interactive){
  if(NATIVE)return nativeToken(interactive);
  return new Promise((res,rej)=>{
    if(token&&Date.now()<tokenExp-60000&&!interactive)return res(token);
    if(!window.google||!google.accounts||!google.accounts.oauth2)return rej(new Error('تعذّر تحميل خدمة جوجل. تأكد من الاتصال بالإنترنت.'));
    if(!cfg.clientId)return rej(new Error('أدخل Client ID من الإعدادات'));
    if(!tc||tcCid!==cfg.clientId){
      tcCid=cfg.clientId;
      tc=google.accounts.oauth2.initTokenClient({client_id:cfg.clientId,scope:SCOPE,
        callback:r=>{if(r.error){pend&&pend.rej(new Error(r.error_description||r.error));return;}token=r.access_token;tokenExp=Date.now()+(r.expires_in||3600)*1000;pend&&pend.res(token);},
        error_callback:e=>{pend&&pend.rej(new Error(interactiveFlag?(e.type==='popup_failed_to_open'?'المتصفح منع نافذة تسجيل الدخول':'لم يكتمل تسجيل الدخول'):'AUTH'));}});
    }
    interactiveFlag=!!interactive;
    pend={res,rej};
    const hint=cfg.deptEmail||(S.user&&S.user.email)||LS.get('email')||undefined;
    tc.requestAccessToken(interactive?(hint?{hint,prompt:''}:{prompt:'select_account'}):{hint,prompt:'none'});
  });
}
let interactiveFlag=true;
async function api(url,opt,retry){
  if(S.demo)return demoFetch(url,opt);
  let t;
  try{t=await getToken(false);}catch(e){throw new Error('AUTH');}
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt&&opt.headers,{Authorization:'Bearer '+t})}));
  if(r.status===401&&retry!==false){token=null;return api(url,opt,false);}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}if(r.status===401)throw new Error('AUTH');throw new Error(m||('HTTP '+r.status));}
  return r;
}
const J=async(u,o)=>{const r=await api(u,o);const t=await r.text();return t?JSON.parse(t):{};};
const JH={'Content-Type':'application/json'};
const post=b=>({method:'POST',headers:JH,body:JSON.stringify(b)});
const put=b=>({method:'PUT',headers:JH,body:JSON.stringify(b)});
const patch=b=>({method:'PATCH',headers:JH,body:JSON.stringify(b)});
const sh=sid=>'https://sheets.googleapis.com/v4/spreadsheets/'+sid;
const vals=(sid,range)=>sh(sid)+'/values/'+encodeURIComponent(range);
const sidFromUrl=u=>{const m=(u||'').match(/\/d\/([A-Za-z0-9_-]+)/);return m?m[1]:'';};

/* ---------- demo mode: same app, local fake Google (no network, nothing leaves the browser) ---------- */
let D=null;
function dLoad(){if(D)return D;try{D=JSON.parse(LS.get('demo_db')||'null');}catch(e){}if(!D)D={tabs:{},ev:{},blobs:{},n:0};return D;}
function dSave(){LS.set('demo_db',JSON.stringify(D));}
function dReset(){D=null;LS.set('demo_db','');}
function nextDow(dow){const d=new Date();do{d.setDate(d.getDate()+1);}while(d.getDay()!==dow);return ymd(d);}
function demoInit(){
  const d=dLoad();
  if(!d.tabs[T1]){
    d.tabs[T1]={id:1,rows:[H1.slice()]};d.tabs[T2]={id:2,rows:[H2.slice()]};
    const mk=(o)=>Object.assign({email:'',inv:[],cond:[],before:[],after:[],eventId:'',id:uid(),created:Date.now(),by:'بيانات تجريبية',editBy:'بيانات تجريبية',editAt:stamp(),ref:'',notes:''},o);
    d.tabs[T1].rows.push(toRow(mk({name:'مريض تجريبي أ',age:'34',phone:'0790000001',nid:'0000000001',dx:'حرق درجة ثانية في الساعد',op:'تطعيم جلد',doc:docs()[0]||'',otype:'major',odate:nextDow(2),ostat:'post',notes:'هذا سجل تجريبي'})));
    d.tabs[T1].rows.push(toRow(mk({name:'مريض تجريبي ب',age:'8',phone:'0790000002',nid:'0000000002',dx:'ندبة تقلصية',op:'تحرير ندبة',doc:docs()[1]||docs()[0]||'',otype:'daily',odate:nextDow(3),ostat:'post'})));
    dSave();
  }
  S.sid='demo';S.gid={};S.gid[T1]=1;S.gid[T2]=2;
}
const RES=(o,st)=>new Response(o===null?null:JSON.stringify(o),{status:st||200});
const cn=s=>[...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
const rtrim=r=>{r=r.slice();while(r.length&&(r[r.length-1]===''||r[r.length-1]==null))r.pop();return r;};
function prange(r){const m=r.match(/^'(.+)'!([A-Z]+)(\d*)(?::([A-Z]+)(\d*))?$/);return {tab:m[1],c1:m[2],r1:m[3]?+m[3]:1,c2:m[4]||m[2],r2:m[5]?+m[5]:Infinity};}
async function demoFetch(url,opt){
  const d=dLoad(),u=new URL(url),m=(opt&&opt.method)||'GET',p=decodeURIComponent(u.pathname);
  const body=()=>{try{return JSON.parse(opt.body)}catch(e){return {}}};
  if(u.host==='sheets.googleapis.com'){
    const rest=p.replace(/^\/v4\/spreadsheets\/[^/:]+/,'');
    if(rest===':batchUpdate'){for(const r of body().requests){if(r.deleteDimension){const g=r.deleteDimension.range;const t=Object.values(d.tabs).find(x=>x.id===g.sheetId);t.rows.splice(g.startIndex,g.endIndex-g.startIndex);}}dSave();return RES({});}
    if(rest==='/values:batchUpdate'){for(const x of body().data){const r=prange(x.range),t=d.tabs[r.tab];while(t.rows.length<r.r1)t.rows.push([]);const row=t.rows[r.r1-1],c=cn(r.c1)-1;while(row.length<c)row.push('');row[c]=x.values[0][0];}dSave();return RES({});}
    if(rest.startsWith('/values/')){
      let rng=rest.slice(8),app=false;if(rng.endsWith(':append')){app=true;rng=rng.slice(0,-7);}
      const r=prange(rng),t=d.tabs[r.tab];
      if(m==='GET'){const c1=cn(r.c1)-1,c2=cn(r.c2);let rows=t.rows.slice(r.r1-1,r.r2===Infinity?undefined:r.r2).map(x=>rtrim(x.slice(c1,c2)));while(rows.length&&!rows[rows.length-1].length)rows.pop();return RES(rows.length?{values:rows}:{});}
      if(m==='PUT'){const c=cn(r.c1)-1;body().values.forEach((v,i)=>{while(t.rows.length<r.r1+i)t.rows.push([]);const row=t.rows[r.r1-1+i];while(row.length<c)row.push('');v.forEach((x,k)=>{row[c+k]=x;});});dSave();return RES({});}
      if(m==='POST'&&app){body().values.forEach(v=>t.rows.push(v));dSave();return RES({});}
    }
  }
  if(u.host==='www.googleapis.com'){
    let mm=p.match(/^\/calendar\/v3\/calendars\/([^/]+)\/events(?:\/(.+))?$/);
    if(mm){
      if(m==='POST'){const id='ev'+uid();d.ev[id]=Object.assign(body(),{cal:mm[1]});dSave();return RES({id});}
      if(m==='PATCH'){if(!d.ev[mm[2]])return RES({error:{message:'gone'}},404);Object.assign(d.ev[mm[2]],body());dSave();return RES({id:mm[2]});}
      if(m==='DELETE'){delete d.ev[mm[2]];dSave();return RES(null,204);}
    }
    mm=p.match(/^\/drive\/v3\/files\/([^/]+)$/);
    if(mm){
      if(m==='GET'&&u.searchParams.get('alt')==='media'){const b=d.blobs[mm[1]];if(!b)return RES({error:{message:'not found'}},404);return new Response(await (await fetch(b)).blob());}
      if(m==='PATCH'){delete d.blobs[mm[1]];dSave();return RES({id:mm[1]});}
    }
  }
  return RES({error:{message:'demo: unsupported '+m+' '+p}},500);
}
async function enterDemo(){
  S.demo=true;S.user={email:'وضع التجربة'};S.sid='';S.folder='';
  await ensure();await loadAll();S.screen='app';msg('');render();
}
let askRes=null;
function ask(t){return new Promise(res=>{$('#dlg p').textContent=t;$('#dlg').style.display='flex';askRes=res;});}

/* ---------- bootstrap sheet + folder ---------- */
async function ensure(){
  if(S.demo){demoInit();return;}
  const key='sid_'+S.user.email;
  let sid=sidFromUrl(cfg.sheetUrl)||LS.get(key);
  if(!sid){
    const q=encodeURIComponent("name='"+DB_NAME+"' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
    const l=await J('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&pageSize=1');
    sid=l.files&&l.files[0]&&l.files[0].id;
  }
  if(!sid){
    const c=await J('https://sheets.googleapis.com/v4/spreadsheets',post({properties:{title:DB_NAME},sheets:[{properties:{title:T1,rightToLeft:true}},{properties:{title:T2,rightToLeft:true}},{properties:{title:T3,rightToLeft:true}}]}));
    sid=c.spreadsheetId;
  }
  if(!sidFromUrl(cfg.sheetUrl))LS.set(key,sid);
  S.sid=sid;
  const meta=()=>J(sh(sid)+'?fields='+encodeURIComponent('sheets.properties(sheetId,title)'));
  let m=await meta();

function info(p){
  const L=[['اسم المريض',p.name],['البريد',p.email],['العمر',p.age],['الهاتف',p.phone],['الرقم الوطني',p.nid],['التشخيص',p.dx],['العملية',p.op],['الطبيب',p.doc],['النوع',OT[p.otype]],['الحالة',OS[p.ostat]],['المرجع',p.ref],['ملاحظات',p.notes]];
  return L.filter(x=>x[1]).map(x=>x[0]+': '+esc(x[1])).join('<br>');
}
async function syncCal(p){
  if(!p.odate)return false;
  const d=new Date(p.odate+'T00:00:00');d.setDate(d.getDate()+1);
  const body={summary:(p.ostat==='cancelled'?'(ملغاة) ':'')+'عملية: '+(p.op||'')+' - '+p.name,description:info(p),start:{date:p.odate},end:{date:ymd(d)}};
  const base='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cfg.calId||'primary')+'/events';
  let ev=null;
  if(p.eventId){try{ev=await J(base+'/'+encodeURIComponent(p.eventId),patch(body));}catch(e){if(e.message==='AUTH')throw e;ev=null;}}
  if(!ev)ev=await J(base,post(body));
  if(ev.id!==p.eventId){p.eventId=ev.id;await savePatient(p);}
  return true;
}

const blobs={};
async function blobUrl(fid){
  if(blobs[fid])return blobs[fid];
  const r=await api('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media');
  return blobs[fid]=URL.createObjectURL(await r.blob());
}
const fidOf=u=>{const m=String(u).match(/\/d\/([^/?]+)/);return m?m[1]:'';};
async function toJpeg(file){
  try{
    const im=await createImageBitmap(file);
    const k=Math.min(1,(S.demo?800:1600)/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',S.demo?0.6:0.85));
  }catch(e){return file;}
}
async function upDrive(blob,name,folder){
  if(S.demo){const id='demo'+uid();dLoad().blobs[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob);});dSave();return {id};}
  const b='x'+uid();
  const body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:[folder]})+'\r\n--'+b+'\r\nContent-Type: '+(blob.type||'image/jpeg')+'\r\n\r\n',blob,'\r\n--'+b+'--']);
  return J('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
}

function FIELDS(){return [['name','اسم المريض','text',1],['email','البريد الإلكتروني','email'],['age','العمر','number',1],['phone','رقم الاتصال','tel',1],['nid','الرقم الوطني','text',1],['dx','التشخيص','text',1],['op','اسم العملية','text',1],['doc','الطبيب المعالج','sel',1,docs().map(x=>[x,x])],['otype','نوع العملية','sel',1,[['major','رئيسية (الثلاثاء)'],['daily','يومية (الأربعاء)']]],['odate','تاريخ العملية','date',1],['ostat','حالة العملية','sel',0,[['post','مؤجلة'],['cancelled','ملغاة'],['done','تمت']]],['ref','المرجع','text']];}
function startDraft(p){
  const vals={};FIELDS().forEach(f=>{vals[f[0]]=p&&p[f[0]]||'';});vals.notes=p&&p.notes||'';
  const ph={};P.forEach(x=>{ph[x[0]]=((p&&p[x[0]])||[]).map(u=>({url:u}));});
  S.draft={pid:p?p.id:null,vals,ph,trash:[],dirty:false};S.cur=S.draft.pid;
}
function syncVals(){
  const v=S.draft.vals;
  FIELDS().forEach(f=>{const el=$('#f_'+f[0]);if(el)v[f[0]]=el.value.trim();});
  const n=$('#f_notes');if(n)v.notes=n.value;
}
function fillGrid(cat){
  const g=$('#ph_'+cat);if(!g||!S.draft)return;
  g.innerHTML=S.draft.ph[cat].map((it,i)=>'<div class="pw"><img alt="" data-cat="'+cat+'" data-i="'+i+'"'+(it.preview?' src="'+it.preview+'"':' data-fid="'+esc(fidOf(it.url))+'"')+'><button class="x" data-rm="'+cat+':'+i+'" aria-label="إزالة">×</button></div>').join('');
  g.querySelectorAll('img[data-fid]').forEach(async im=>{try{im.src=await blobUrl(im.dataset.fid);}catch(e){im.alt='✕';}});
}
function leaveDraft(){S.draft=null;S.cur=null;}
async function saveDraft(){
  const d=S.draft;
  syncVals();
  const o=d.vals,c=check(o);if(c.err){msg(c.err);return;}
  if(d.pid&&!S.pts.find(x=>x.id===d.pid))await loadAll();
  let todo=0;P.forEach(x=>d.ph[x[0]].forEach(it=>{if(!it.url)todo++;}));
  let n=0;
  if(todo){
    const folder=await ensureFolder();
    for(const x of P){
      for(const it of d.ph[x[0]]){
        if(it.url)continue;
        msg('جارٍ رفع الصور… '+(++n)+'/'+todo,true);
        const r=await upDrive(await toJpeg(it.file),o.name+' - '+x[1]+' - '+Date.now()+'.jpg',folder);
        it.url='https://drive.google.com/file/d/'+r.id+'/view';
      }
    }
  }
  msg('جارٍ الحفظ في الشيت…',true);
  const ph={};P.forEach(x=>{ph[x[0]]=d.ph[x[0]].map(it=>it.url);});
  let pid=d.pid;
  if(pid){
    const p=Object.assign(S.pts.find(x=>x.id===pid),o,ph);
    await savePatient(p);
  }else{
    const p=await addPatient(Object.assign({},o,ph));
    pid=d.pid=p.id;S.cur=pid;
  }
  await loadAll();
  let w='';
  const q=S.pts.find(x=>x.id===pid);
  if(q&&cfg.autoCal&&q.odate){try{await syncCal(q);}catch(e){if(e.message==='AUTH')throw e;w=' (تعذّر تحديث التقويم: '+e.message+')';}}
  for(const u of d.trash){try{await api('https://www.googleapis.com/drive/v3/files/'+fidOf(u),patch({trashed:true}));}catch(e){if(e.message==='AUTH')throw e;}}
  leaveDraft();await loadAll();render();window.scrollTo(0,0);
  msg('تم الحفظ بنجاح. '+(c.warn||'')+w,!c.warn&&!w);
}

  if(S.av==='list'){
    const up=s.filter(x=>x.date>=today),pa=s.filter(x=>x.date<today).reverse();
    return h+'<h2>القادمة</h2>'+(up.map(row).join('')||'<p class="mut">لا توجد مواعيد قادمة.</p>')+(pa.length?'<h2>السابقة</h2>'+pa.map(row).join(''):'');
  }
  const by={};s.forEach(x=>{(by[x.date]=by[x.date]||[]).push(x);});
  const A=pd(S.ad);
  const chip=x=>'<span class="chip '+(x.ty||'')+'">'+esc(x.name)+'</span>';
  let grid='',title='';
  if(S.av==='month'){
    title=MN[A.getMonth()]+' '+A.getFullYear();
    const first=new Date(A.getFullYear(),A.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
    grid='<div class="mg">'+WD.map(w=>'<div class="wh">'+w.slice(0,3)+'</div>').join('');
    for(let i=0;i<42;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d),it=by[k]||[];
      if(i>=35&&d.getMonth()!==A.getMonth())break;
      grid+='<button class="dc '+(d.getMonth()!==A.getMonth()?'oth ':'')+(k===today?'tod ':'')+(k===S.ad?'sel':'')+'" data-day="'+k+'"><span>'+d.getDate()+'</span>'+(it.length?'<i>'+it.length+'</i>':'')+'</button>';
    }
    grid+='</div>';
  }else{
    const st=new Date(A);st.setDate(A.getDate()-A.getDay());const en=new Date(st);en.setDate(st.getDate()+6);
    title=st.getDate()+' '+MN[st.getMonth()]+' – '+en.getDate()+' '+MN[en.getMonth()]+' '+en.getFullYear();
    grid='<div class="wk">';
    for(let i=0;i<7;i++){
      const d=new Date(st);d.setDate(st.getDate()+i);const k=ymd(d),it=by[k]||[];
      grid+='<div class="wd '+(k===today?'tod':'')+'" data-day="'+k+'"><div class="wl"><b>'+WD[i]+'</b><span class="mut">'+d.getDate()+'</span></div><div class="wc">'+(it.map(x=>'<div class="chip '+(x.ty||'')+'" data-open="'+esc(x.pid)+'">'+esc(x.name)+'<small>'+esc(x.note||'')+'</small></div>').join('')||'<span class="mut">—</span>')+'</div></div>';
    }
    grid+='</div>';
  }
  h+='<div class="row nav"><button data-nav="-1">→ السابق</button><button data-today>اليوم</button><button data-nav="1">التالي ←</button></div><h2 class="ct">'+title+'</h2>'+grid;
  if(S.av==='month'){
    const it=by[S.ad]||[];
    h+='<h2>'+fmt(S.ad)+'</h2>'+(it.map(row).join('')||'<p class="mut">لا توجد مواعيد في هذا اليوم.</p>');
  }
  h+='<p class="mut leg"><span class="chip major">رئيسية</span> <span class="chip daily">يومية</span> <span class="chip ap">مراجعة</span></p>';
  return h;
}
function editorView(){
  const d=S.draft,p=d.pid?S.pts.find(x=>x.id===d.pid):null;
  let h='<button data-back>→ رجوع</button>'+(p?'<p class="mut">أدخله: '+esc(p.by||'-')+(p.editBy?' · آخر تعديل: '+esc(p.editBy)+' ('+esc(p.editAt)+')':'')+'</p>':'<h2>مريض جديد</h2>');
  h+='<div class="card">'+form(d.vals)+'</div>';
  h+=P.map(x=>'<h2>'+x[1]+'</h2><div class="card"><div class="ph" id="ph_'+x[0]+'"></div><input type="file" accept="image/*" multiple data-up="'+x[0]+'"></div>').join('');
  h+='<button class="pr" data-save style="width:100%;margin:14px 0">'+(p?'حفظ التعديلات':'حفظ المريض')+'</button>';
  if(p){
    const mine=S.ap.filter(x=>x.pid===p.id).sort((x,y)=>x.date.localeCompare(y.date));
    h+='<h2>مواعيد أخرى (مراجعات)</h2><div class="card">'+(mine.map(x=>'<p>'+fmt(x.date)+(x.note?' · '+esc(x.note):'')+(x.by?' · '+esc(x.by):'')+' <button class="dn sm" data-delap="'+esc(x.id)+'">حذف</button></p>').join('')||'<p class="mut">لا توجد مواعيد.</p>')+
    '<div class="row"><input id="ad" type="date"><input id="an" placeholder="ملاحظة"></div><button class="pr" data-addap>إضافة موعد</button></div>'+
    '<div class="card row"><button data-cal>'+(p.eventId?'تحديث التقويم ✓':'أضف العملية للتقويم')+'</button></div>'+
    '<button class="dn" data-del>حذف المريض</button>';
  }
  return h;
}
function render(){
  const a=$('#app');
  $('#who').innerHTML=S.me?'<span class="mut">'+esc(who())+(S.user?' · '+esc(S.user.email):'')+'</span> <button class="sm" data-gear>⚙</button>':'';
  if(S.screen==='auth'||!S.me){a.innerHTML=authView();return;}
  $('#banner').innerHTML=S.demo?'<div class="demo">وضع التجربة: البيانات تُحفظ على هذا الجهاز فقط ولا تُرسل إلى جوجل.</div>':'';
  if(S.screen==='demosheet'){a.innerHTML=demoSheetView();return;}
  if(S.screen==='settings'){a.innerHTML=settingsView();return;}
  if(S.screen==='login'){a.innerHTML=loginView();return;}
  if(S.draft&&(!S.draft.pid||S.pts.find(x=>x.id===S.draft.pid))){a.innerHTML=editorView();P.forEach(x=>fillGrid(x[0]));return;}
  S.draft=null;S.cur=null;
  a.innerHTML=tabsHtml()+(S.tab==='p'?list():agenda());
}

/* ---------- actions ---------- */
function fail(e){
  if(e&&e.message==='AUTH'){S.screen='login';render();msg('انتهت الجلسة. سجّل الدخول من جديد.');return;}
  msg('حدث خطأ: '+(e&&e.message||'غير معروف'));
}
let pushOn=false;
async function saveToken(t){
  if(!t||!S.sid||S.demo)return;
  try{
    const r=await J(vals(S.sid,q1(T3)+'!A2:D'));
    const rows=r.values||[];
    const i=rows.findIndex(x=>x[0]===t);
    const row=[t,who(),(S.user&&S.user.email)||'',stamp()];
    if(i>=0)await J(vals(S.sid,q1(T3)+'!A'+(i+2)+':D'+(i+2))+'?valueInputOption=RAW',put({values:[row]}));
    else await J(vals(S.sid,q1(T3)+'!A:D')+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',post({values:[row]}));
  }catch(e){}
}
async function registerPush(){
  const PN=NP('PushNotifications');
  if(!NATIVE||!PN||S.demo)return;
  try{
    if(!pushOn){
      pushOn=true;
      PN.addListener('registration',x=>{LS.set('fcm',x.value);saveToken(x.value);});
      PN.addListener('registrationError',()=>{});
      PN.addListener('pushNotificationReceived',n=>{msg((n.title||'')+(n.body?': '+n.body:''),true);loadAll().then(render).catch(()=>{});});
      PN.addListener('pushNotificationActionPerformed',()=>{S.tab='a';S.draft=null;render();loadAll().then(render).catch(()=>{});});
      try{await PN.createChannel({id:'ops',name:'العمليات والمواعيد',description:'تنبيهات المرضى والعمليات',importance:5,visibility:1,vibration:true});}catch(e){}
    }
    let p=await PN.checkPermissions();
    if(p.receive!=='granted')p=await PN.requestPermissions();
    if(p.receive!=='granted'){msg('الإشعارات غير مفعّلة. فعّلها من إعدادات الهاتف للتطبيق.');return;}
    const old=LS.get('fcm');
    if(old)saveToken(old);
    await PN.register();
  }catch(e){}
}
async function login(){
  try{
    msg('جارٍ تسجيل الدخول…',true);
    await getToken(true);
    const u=await J('https://www.googleapis.com/oauth2/v3/userinfo');
    const changed=!S.user||S.user.email!==u.email;
    if(cfg.deptEmail&&u.email.toLowerCase()!==cfg.deptEmail.trim().toLowerCase()){token=null;S.user=null;msg('سجّلت الدخول بحساب مختلف ('+u.email+'). المطلوب حساب الدائرة: '+cfg.deptEmail);return;}
    S.user={email:u.email,name:u.name};LS.set('email',u.email);
    if(changed||!S.sid){S.folder='';await ensure();}
    await loadAll();
    S.screen='app';msg('');render();
    registerPush();
  }catch(e){if(e.message==='AUTH')e=new Error('لم يكتمل تسجيل الدخول');msg(e.message);}
}
function track(e){
  const t=e.target;if(!S.draft||!t.id||t.id.indexOf('f_')!==0)return;
  S.draft.vals[t.id.slice(2)]=t.id==='f_notes'?t.value:t.value.trim();S.draft.dirty=true;
}
document.addEventListener('input',e=>{
  track(e);
  if(e.target.id==='aq'){S.aq=e.target.value;const pos=e.target.selectionStart;render();const i=$('#aq');if(i){i.focus();i.setSelectionRange(pos,pos);}}
  if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(pos,pos);}}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-av],[data-nav],[data-today],[data-day],[data-open],[data-login],[data-gear],[data-savecfg],[data-cancelcfg],[data-logout],[data-new],[data-cancel],[data-add],[data-save],[data-back],[data-cal],[data-addap],[data-delap],[data-del],[data-sheetlink],[data-auth],[data-mode],[data-forgot],[data-mine],[data-lbclose],[data-rm],[data-demo],[data-yes],[data-no],[data-savedoc],[data-demoreset],[data-closesheet],.pw img');
  if(!t){if(e.target.id==='lb')$('#lb').style.display='none';return;}
  const d=t.dataset;
  if(d.yes!==undefined||d.no!==undefined){$('#dlg').style.display='none';if(askRes){const r=askRes;askRes=null;r(d.yes!==undefined);}return;}
  if(d.login!==undefined){login();return;}   // must run synchronously inside the click (popup)
  run(async()=>{
    if(d.demo!==undefined){await enterDemo();}
    else if(d.closesheet!==undefined){S.screen='app';render();}
    else if(d.savedoc!==undefined){cfg.doctors=$('#s_docs').value;saveCfg();S.screen='app';msg('تم الحفظ',true);render();}
    else if(d.demoreset!==undefined){if(!await ask('مسح كل البيانات التجريبية؟'))return;dReset();leaveDraft();await ensure();await loadAll();S.screen='app';msg('مُسحت البيانات التجريبية',true);render();}
    else if(d.mode!==undefined){S.authMode=d.mode;msg('');render();}
    else if(d.mine!==undefined){S.mine=!S.mine;render();}
    else if(d.forgot!==undefined){
      const un=($('#a_user').value||'').trim().toLowerCase(),us=getUsers();
      if(!us[un]){msg('اكتب اسم المستخدم في الحقل أولاً');return;}
      if(!await ask('حذف الحساب "'+un+'" من هذا الجهاز لإنشاء حساب جديد؟ بياناتك المحفوظة في جوجل لا تتأثر.'))return;
      delete us[un];LS.set('users',JSON.stringify(us));S.authMode='reg';msg('حُذف الحساب. أنشئ حساباً جديداً.',true);render();
    }
    else if(d.auth!==undefined){
      const reg=S.authMode==='reg'||!Object.keys(getUsers()).length;
      const un=$('#a_user').value.trim().toLowerCase(),pw=$('#a_pass').value,us=getUsers();
      if(!un||!pw){msg('اكتب اسم المستخدم وكلمة المرور');return;}
      if(reg){
        const nm=$('#a_name').value.trim();
        if(!nm){msg('اكتب الاسم الكامل');return;}
        if(!/^[a-z0-9._-]{3,}$/.test(un)){msg('اسم المستخدم: 3 أحرف أو أكثر بالإنجليزية أو الأرقام');return;}
        if(us[un]){msg('اسم المستخدم مستخدم من قبل');return;}
        if(pw.length<6){msg('كلمة المرور قصيرة (6 أحرف على الأقل)');return;}
        if(pw!==$('#a_pass2').value){msg('كلمتا المرور غير متطابقتين');return;}
        const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
        us[un]={name:nm,salt,hash:await hashPw(pw,salt)};LS.set('users',JSON.stringify(us));
      }else{
        const u=us[un];
        if(!u||await hashPw(pw,u.salt)!==u.hash){await new Promise(r=>setTimeout(r,600));msg('اسم المستخدم أو كلمة المرور غير صحيحة');return;}
      }
      S.me={username:un,name:us[un].name};SS.set('me',un);loadCfg(un);S.authMode='';
      S.screen=cfg.clientId?'login':'settings';msg('');render();
      if(DEMO_ONLY){await enterDemo();}
    }
    else if(d.gear!==undefined){S.screen='settings';render();}
    else if(d.cancelcfg!==undefined){S.screen=S.user?'app':'login';render();}
    else if(d.savecfg!==undefined){
      const nc={deptEmail:$('#s_dept').value.trim(),clientId:$('#s_cid').value.trim(),sheetUrl:$('#s_sheet').value.trim(),calId:$('#s_cal').value.trim(),doctors:$('#s_docs').value,autoCal:$('#s_auto').checked};
      if(!nc.clientId){msg('أدخل Client ID');return;}
      const reset=nc.clientId!==cfg.clientId||nc.deptEmail!==cfg.deptEmail,sheetChanged=nc.sheetUrl!==cfg.sheetUrl;
      cfg=nc;saveCfg();
      if(reset){token=null;tc=null;S.user=null;S.sid='';S.screen='login';}
      else if(sheetChanged&&S.user){S.screen='app';await ensure();await loadAll();}
      else S.screen=S.user?'app':'login';
      msg('تم حفظ الإعدادات',true);render();
    }
    else if(d.logout!==undefined){S.demo=false;D=null;token=null;S.user=null;S.me=null;S.sid='';S.folder='';S.pts=[];S.ap=[];leaveDraft();SS.del('me');S.screen='auth';msg('');render();}
    else if(d.t){S.tab=d.t;render();}
    else if(d.av){S.av=d.av;render();}
    else if(d.today!==undefined){S.ad=ymd(new Date());render();}
    else if(d.nav){const n=Number(d.nav),A=pd(S.ad||ymd(new Date()));if(S.av==='month'){const dd=A.getDate();A.setDate(1);A.setMonth(A.getMonth()+n);A.setDate(Math.min(dd,new Date(A.getFullYear(),A.getMonth()+1,0).getDate()));}else A.setDate(A.getDate()+7*n);S.ad=ymd(A);render();}
    else if(d.day&&t.closest('button')){S.ad=d.day;render();}
    else if(d.new!==undefined){startDraft(null);msg('');render();window.scrollTo(0,0);}
    else if(d.open){const p=S.pts.find(x=>x.id===d.open);if(!p){msg('هذا السجل لم يعد موجوداً');return;}startDraft(p);msg('');render();window.scrollTo(0,0);}
    else if(d.back!==undefined){if(S.draft&&S.draft.dirty&&!await ask('تجاهل البيانات غير المحفوظة؟'))return;leaveDraft();msg('');render();}
    else if(d.rm!==undefined){
      const [cat,i]=d.rm.split(':');const it=S.draft.ph[cat][Number(i)];
      if(!await ask('إزالة هذه الصورة؟ تُحذف نهائياً عند الحفظ.'))return;
      if(it.url)S.draft.trash.push(it.url);
      S.draft.ph[cat].splice(Number(i),1);S.draft.dirty=true;fillGrid(cat);
    }
    else if(d.sheetlink!==undefined&&S.demo){S.screen='demosheet';render();window.scrollTo(0,0);}
    else if(d.sheetlink!==undefined){window.open('https://docs.google.com/spreadsheets/d/'+S.sid,'_blank');}
    else if(t.matches('.pw img')){if(t.src){$('#lb img').src=t.src;$('#lb').style.display='flex';}}
    else if(d.lbclose!==undefined){$('#lb').style.display='none';}
    else if(d.save!==undefined){await saveDraft();}
    else if(d.cal!==undefined){
      const p=S.pts.find(x=>x.id===S.cur);
      if(S.draft&&S.draft.dirty){msg('احفظ التعديلات أولاً');return;}
      if(!p.odate){msg('أدخل تاريخ العملية واحفظ أولاً');return;}
      msg('جارٍ التحديث…',true);await syncCal(p);await loadAll();render();msg('تم تحديث التقويم',true);
    }
    else if(d.addap!==undefined){
      const dt=$('#ad').value;if(!dt){msg('اختر تاريخ الموعد');return;}
      const p=S.pts.find(x=>x.id===S.cur);
      await J(vals(S.sid,q1(T2)+'!A:'+col(H2.length))+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',post({values:[[p.name,dt,$('#an').value.trim(),p.id,uid(),who()]]}));
      await loadAll();render();msg('');
    }
    else if(d.delap){
      if(!await ask('حذف الموعد؟'))return;
      const a=S.ap.find(x=>x.id===d.delap);if(a){await delRows(T2,[a.row]);await loadAll();render();}
    }
    else if(d.del!==undefined){
      if(!await ask('حذف المريض وكل مواعيده؟'))return;
      const p=S.pts.find(x=>x.id===S.cur);
      if(p.eventId){try{await api('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cfg.calId||'primary')+'/events/'+encodeURIComponent(p.eventId),{method:'DELETE'});}catch(e){if(e.message==='AUTH')throw e;}}
      const rows=S.ap.filter(x=>x.pid===p.id).map(x=>x.row);
      if(rows.length)await delRows(T2,rows);
      await delRows(T1,[p.row]);
      leaveDraft();await loadAll();render();msg('حُذف المريض',true);
    }
  });
});
document.addEventListener('change',e=>{
  track(e);
  const k=e.target.dataset&&e.target.dataset.up;if(!k||!S.draft)return;
  const files=Array.from(e.target.files||[]);if(!files.length)return;
  files.forEach(f=>S.draft.ph[k].push({file:f,preview:URL.createObjectURL(f)}));
  S.draft.dirty=true;e.target.value='';fillGrid(k);
});
async function run(fn){try{await fn();}catch(e){fail(e);}}
(function init(){
  const un=SS.get('me'),u=un&&getUsers()[un];
  if(u){S.me={username:un,name:u.name};loadCfg(un);S.screen=cfg.clientId?'login':'settings';}
  else S.screen='auth';
  render();
  if(u&&DEMO_ONLY)enterDemo().catch(fail);
})();
initNative();
</script>
