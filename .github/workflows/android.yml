name: Build Android APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check secrets
        env: { GS: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: test -n "$GS" || (echo "Missing secret GOOGLE_SERVICES_JSON" && exit 1)
      - name: Prepare web files
        env: { REDIRECT_OVERRIDE: '${{ vars.REDIRECT_URI }}' }
        run: |
          mkdir www
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$REDIRECT_OVERRIDE" ]; then URI="$REDIRECT_OVERRIDE";
          elif [ "$(echo $REPO | tr 'A-Z' 'a-z')" = "$OWNER.github.io" ]; then URI="https://$OWNER.github.io/oauth.html";
          else URI="https://$OWNER.github.io/$REPO/oauth.html"; fi
          echo "Redirect URI: $URI"
          sed "s|__REDIRECT_URI__|$URI|g" index.html > www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Version from run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Firebase config
        env: { GS: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: printf '%s' "$GS" > android/app/google-services.json
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          flt='''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="burnzarqa" android:host="oauth" />
              </intent-filter>
          </activity>'''
          s=s.replace('</activity>',flt,1)
          if 'POST_NOTIFICATIONS' not in s:
              s=s.replace('</manifest>','    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - run: npx cap sync android
      - name: Build APK
        env: { KS: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          test -n "$KS" || (echo "Missing secret KEYSTORE_B64" && exit 1)
          mkdir -p ~/.android && printf '%s' "$KS" | base64 -d > ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: burn-patients-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish pre-release (waits for approval)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk burn-patients.apk
          gh release create "v${{ github.run_number }}" burn-patients.apk --prerelease --target "$GITHUB_SHA" --title "Build ${{ github.run_number }}" --notes "Pending approval"
